---
openapi: 3.0.3
info:
  title: Orders API
  description: Demo API for managing orders.
  version: 1.0.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: https://api.example.test
security:
- oauth2:
  - api:access
tags:
- name: orders
  description: Orders operations.
- name: health
  description: Service health and version information.
paths:
  "/orders":
    get:
      operationId: listOrders
      summary: List orders
      description: Return the available orders.
      tags:
      - orders
      parameters:
      - name: x-request-id
        in: header
        description: Unique request identifier for tracing.
        required: true
        schema:
          type: string
          format: uuid
          maxLength: 36
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
      responses:
        '200':
          description: List orders succeeded
          headers:
            X-RateLimit-Limit:
              description: Maximum requests permitted in the rate limit window.
              schema:
                type: integer
                minimum: 1
                format: int32
                maximum: 2147483647
        '400':
          "$ref": "#/components/responses/BadRequest"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
  "/health":
    get:
      operationId: getHealth
      summary: Get service health
      description: Return the current service health.
      tags:
      - health
      parameters:
      - name: x-request-id
        in: header
        description: Unique request identifier for tracing.
        required: true
        schema:
          type: string
          format: uuid
          maxLength: 36
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
      responses:
        '200':
          description: Get service health succeeded
          headers:
            X-RateLimit-Limit:
              description: Maximum requests permitted in the rate limit window.
              schema:
                type: integer
                minimum: 1
                format: int32
                maximum: 2147483647
        '400':
          "$ref": "#/components/responses/BadRequest"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
  "/health/info":
    get:
      operationId: getHealthInfo
      summary: Get service information
      description: Return the service name and version.
      tags:
      - health
      parameters:
      - name: x-request-id
        in: header
        description: Unique request identifier for tracing.
        required: true
        schema:
          type: string
          format: uuid
          maxLength: 36
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
      responses:
        '200':
          description: Get service information succeeded
          headers:
            X-RateLimit-Limit:
              description: Maximum requests permitted in the rate limit window.
              schema:
                type: integer
                minimum: 1
                format: int32
                maximum: 2147483647
        '400':
          "$ref": "#/components/responses/BadRequest"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '500':
          "$ref": "#/components/responses/InternalServerError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.test/oauth/token
          scopes:
            api:access: Access the demo API
      description: OAuth2 access tokens must be validated according to RFC8725.
  responses:
    BadRequest:
      description: Request validation failed.
      headers:
        X-RateLimit-Limit:
          description: Maximum requests permitted in the rate limit window.
          schema:
            type: integer
            minimum: 1
            format: int32
            maximum: 2147483647
        Content-Type:
          description: Media type of the response body.
          schema:
            type: string
            enum:
            - application/json
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/error"
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        X-RateLimit-Limit:
          description: Maximum requests permitted in the rate limit window.
          schema:
            type: integer
            minimum: 1
            format: int32
            maximum: 2147483647
        Content-Type:
          description: Media type of the response body.
          schema:
            type: string
            enum:
            - application/json
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 3600
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/error"
    InternalServerError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/error"
      headers:
        Content-Type:
          description: Media type of the response body.
          schema:
            type: string
            enum:
            - application/json
    Unauthorized:
      description: A valid access token is required.
      headers:
        X-RateLimit-Limit:
          description: Maximum requests permitted in the rate limit window.
          schema:
            type: integer
            minimum: 1
            format: int32
            maximum: 2147483647
        Content-Type:
          description: Media type of the response body.
          schema:
            type: string
            enum:
            - application/json
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/error"
  schemas:
    error:
      type: object
      required:
      - timestamp
      - status
      - error
      - path
      properties:
        timestamp:
          type: string
          format: date-time
          maxLength: 256
          pattern: "^.+$"
        status:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        error:
          type: string
          maxLength: 256
          pattern: "^.+$"
          format: string
        path:
          type: string
          maxLength: 256
          pattern: "^.+$"
          format: string
