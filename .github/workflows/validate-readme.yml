name: Validate README

on:
  push:
    branches:
      - '**'

jobs:
  validate-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run validate README script
        run: python3 scripts/validate_readme_commands.py --check-only
